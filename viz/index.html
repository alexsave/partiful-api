<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Globe Coverage</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow: hidden;
        }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%);
            padding: 15px 30px;
            border-bottom: 1px solid #0f4c75;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .view-toggle {
            display: flex;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #0f4c75;
            overflow: hidden;
        }

        .view-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #888;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-btn:hover {
            color: #e0e0e0;
        }

        .view-btn.active {
            background: #0f4c75;
            color: #00d4ff;
        }

        .filters {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-label {
            font-size: 0.6rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-select {
            background: #0d1117;
            border: 1px solid #0f4c75;
            color: #e0e0e0;
            padding: 5px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            min-width: 100px;
        }

        .filter-select:hover {
            border-color: #00d4ff;
        }

        .filter-select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
        }

        .stats {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 0.6rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #globe-container, #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #globe-container {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
        }

        #map-container {
            background: #0d1117;
        }

        .leaflet-container {
            background: #0d1117;
        }

        .hidden {
            display: none !important;
        }

        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(10, 10, 15, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #0f4c75;
            z-index: 1000;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(10, 10, 15, 0.95);
            padding: 30px 50px;
            border-radius: 12px;
            border: 1px solid #0f4c75;
            text-align: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1a1a2e;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #ff6b6b;
            padding: 20px;
            text-align: center;
        }

        .pool-popup {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
        }

        .pool-popup h3 {
            margin: 0 0 8px 0;
            color: #0099ff;
            font-size: 14px;
        }

        .pool-popup p {
            margin: 4px 0;
            color: #333;
        }

        /* Simulation Controls */
        .sim-panel {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: rgba(10, 10, 15, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #0f4c75;
            z-index: 1000;
            backdrop-filter: blur(10px);
            min-width: 280px;
        }

        .sim-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sim-row {
            margin-bottom: 12px;
        }

        .sim-label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .traversal-buttons {
            display: flex;
            gap: 6px;
        }

        .traversal-btn {
            flex: 1;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #0f4c75;
            color: #888;
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .traversal-btn:hover {
            color: #e0e0e0;
            border-color: #00d4ff;
        }

        .traversal-btn.active {
            background: #0f4c75;
            color: #00d4ff;
            border-color: #00d4ff;
        }

        .sim-controls {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .sim-btn {
            flex: 1;
            padding: 10px 16px;
            background: linear-gradient(135deg, #0f4c75 0%, #0a3552 100%);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .sim-btn:hover {
            background: linear-gradient(135deg, #1a5c85 0%, #0f4c75 100%);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .sim-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sim-btn.danger {
            background: linear-gradient(135deg, #5c2020 0%, #3d1515 100%);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .sim-btn.danger:hover {
            background: linear-gradient(135deg, #7a2a2a 0%, #5c2020 100%);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        }

        .speed-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #0d1117;
            border-radius: 3px;
            outline: none;
            border: 1px solid #0f4c75;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
        }

        .speed-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
        }

        .speed-value {
            font-size: 0.75rem;
            color: #00d4ff;
            text-align: center;
            margin-top: 5px;
        }

        .sim-progress {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #0f4c75;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #0d1117;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #0f4c75;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.7rem;
            color: #888;
        }

        .progress-text span {
            color: #00d4ff;
        }

        /* Current cell highlight */
        .current-cell-marker {
            stroke: #ffcc00 !important;
            stroke-width: 3 !important;
            fill: rgba(255, 204, 0, 0.3) !important;
        }

    </style>
</head>
<body>
    <div id="header">
        <h1>🌊 Pool Globe</h1>
        <div class="controls">
            <div class="view-toggle">
                <button class="view-btn" id="btn-globe">🌍 Globe</button>
                <button class="view-btn active" id="btn-map">🗺️ Map</button>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <span class="filter-label">Public</span>
                    <select id="filter-public" class="filter-select">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">Length</span>
                    <select id="filter-length" class="filter-select">
                        <option value="">All</option>
                    </select>
                </div>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="pool-count">-</div>
                    <div class="stat-label">Pools Found</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="cell-count">-</div>
                    <div class="stat-label">Cells Left</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="coverage">-</div>
                    <div class="stat-label">Coverage</div>
                </div>
            </div>
        </div>
    </div>

    <div id="globe-container" class="hidden"></div>
    <div id="map-container"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background: #00d4ff; box-shadow: 0 0 8px #00d4ff;"></div>
            <span>Pool location</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: rgba(255, 107, 107, 0.5); border-radius: 3px;"></div>
            <span>Remaining cell</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: rgba(255, 204, 0, 0.5); border: 2px solid #ffcc00; border-radius: 3px;"></div>
            <span>Current cell</span>
        </div>
    </div>

    <div class="sim-panel">
        <div class="sim-title">
            <span>⚡</span> Search Simulation
        </div>
        
        <div class="sim-row">
            <div class="sim-label">Traversal Mode</div>
            <div class="traversal-buttons">
                <button class="traversal-btn" id="mode-pop" title="Depth-first: process newest cells first">
                    📥 Pop<br><small style="opacity:0.6">depth</small>
                </button>
                <button class="traversal-btn" id="mode-shift" title="Breadth-first: process oldest cells first">
                    📤 Shift<br><small style="opacity:0.6">breadth</small>
                </button>
                <button class="traversal-btn active" id="mode-random" title="Random: process random cells">
                    🎲 Random<br><small style="opacity:0.6">chaotic</small>
                </button>
            </div>
        </div>

        <div class="sim-row">
            <div class="sim-label">Speed (ms delay)</div>
            <input type="range" class="speed-slider" id="speed-slider" min="10" max="2000" value="200">
            <div class="speed-value" id="speed-value">200ms</div>
        </div>

        <div class="sim-controls">
            <button class="sim-btn" id="btn-start">▶ Start</button>
            <button class="sim-btn danger" id="btn-reset">↺ Reset</button>
        </div>

        <div class="sim-progress">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
            </div>
            <div class="progress-text">
                <div>Queries: <span id="query-count">0</span></div>
                <div>Subdivisions: <span id="subdivide-count">0</span></div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div>Loading pool data...</div>
    </div>

    <script src="https://unpkg.com/globe.gl@2.27.0/dist/globe.gl.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
